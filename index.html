<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Mini-Prof</title>
 <!-- Icône Mini-Prof -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfcff;--line:#cfdcf2;--margin:#e8838a;--ink:#1b2a4a;--soft:#55648a;--card:#ffffff;--ok:#1f8a4c;--ko:#c93a45;--okbg:#e3f5ea;--kobg:#fde8ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b2d;--line:#25304d;--margin:#a24a55;--ink:#e6ecfb;--soft:#9aa8cc;--card:#1c2540;--ok:#5fd08a;--ko:#ff7d86;--okbg:#17382a;--kobg:#42212a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b2d;--line:#25304d;--margin:#a24a55;--ink:#e6ecfb;--soft:#9aa8cc;--card:#1c2540;--ok:#5fd08a;--ko:#ff7d86;--okbg:#17382a;--kobg:#42212a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px 28px;position:relative}
main::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--margin)}
h1,h2,h3{font-family:"Patrick Hand","Comic Sans MS",cursive,sans-serif;font-weight:400;margin:0}
h1{font-size:38px;line-height:1.1}
h2{font-size:30px}
.sub{color:var(--soft);margin:6px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{background:var(--card);border:2px solid var(--c);border-radius:6px 14px 6px 14px;padding:14px;text-align:left;color:var(--ink);cursor:pointer;font:inherit;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.sbtn b{font:400 24px "Patrick Hand","Comic Sans MS",cursive;color:var(--c)}
.sbtn small{color:var(--soft)}
button:focus-visible{outline:3px solid var(--c,#4a7bd8);outline-offset:2px}
.back{background:none;border:0;color:var(--soft);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:8px}
.tabs{display:flex;gap:5px;margin:14px 0}
.tabs .tab{font-size:13px;padding:9px 2px;min-width:0}
.tab{flex:1;padding:10px;border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--c);color:#fff}
.card{background:var(--card);border:2px solid var(--c);border-radius:6px 14px 6px 14px;padding:16px;margin-bottom:12px}
.card h3{color:var(--c);font-size:24px;margin-bottom:4px}
.card ul{margin:6px 0 0;padding-left:20px}
.card li{margin:4px 0}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.q{font-size:20px;margin:0 0 14px;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.exp{margin:12px 0;padding:12px;border-left:4px solid var(--c);background:var(--card);border-radius:0 8px 8px 0}
.go{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--c);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.big{font:400 64px "Patrick Hand","Comic Sans MS",cursive;color:var(--c);text-align:center;margin:10px 0}
.center{text-align:center}
.fig{margin:12px 0 0;text-align:center;color:var(--ink)}
.fig svg{max-width:100%;height:auto;font-family:inherit}
.why{margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--c);background:var(--bg);border-radius:0 8px 8px 0}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

.lesson-book{background:var(--card);border:2px solid var(--c);border-radius:12px 18px 12px 18px;margin:12px 0;overflow:hidden;box-shadow:2px 3px 0 var(--line)}
.lesson-book summary{list-style:none;cursor:pointer;padding:15px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--card)),var(--card));font-weight:600}
.lesson-book summary::-webkit-details-marker{display:none}
.lesson-book summary::after{content:"＋";margin-left:auto;font-size:22px;color:var(--c);font-weight:bold}
.lesson-book[open] summary::after{content:"−"}
.book-icon{font-size:24px}
.book-title{font:400 25px \"Patrick Hand\",\"Comic Sans MS\",cursive;color:var(--c)}
.book-hint{font-size:12px;color:var(--soft);margin-left:auto}
.lesson-book[open] .book-hint{display:none}
.book-page{padding:14px 16px 16px;border-top:2px dashed var(--line);animation:bookOpen .25s ease-out}
@keyframes bookOpen{from{opacity:.5;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

</style>
</head>

<script>
var S=[
{id:"maths",n:"Maths",c:"#2f6fd6",x:[["Un triangle ABC est rectangle en A, avec AB = 9 cm et AC = 12 cm. Calcule BC.","BC² = AB² + AC² = 81 + 144 = 225, donc BC = 15 cm."],["Résous 3x − 5 = 2x + 7.","3x − 2x = 7 + 5, donc x = 12. Vérification : 3 × 12 − 5 = 31 et 2 × 12 + 7 = 31."],["Un élève a eu 12 (coef. 2), 15 (coef. 3) et 9 (coef. 1). Calcule sa moyenne.","(12 × 2 + 15 × 3 + 9 × 1) ÷ 6 = (24 + 45 + 9) ÷ 6 = 78 ÷ 6 = 13."]],f:[
["Théorème de Pythagore",["Dans un triangle rectangle : hypoténuse² = somme des carrés des deux autres côtés.","La réciproque permet de prouver qu’un triangle est rectangle."],"L’hypoténuse est le plus grand côté, en face de l’angle droit. Exemple : côtés 6 et 8 → 36 + 64 = 100, donc hypoténuse = 10. Pour la réciproque, on compare le carré du plus grand côté à la somme des deux autres carrés : s’il y a égalité, le triangle est rectangle.<br><br><b>Étapes :</b> 1) Repère l’angle droit : l’hypoténuse est le côté en face. 2) Si tu cherches l’hypoténuse, additionne les carrés des deux autres côtés, puis prends la racine carrée. 3) Si tu cherches un autre côté, soustrais : carré de l’hypoténuse − carré du côté connu."],
["Puissances de 10",["10ⁿ × 10ᵖ = 10ⁿ⁺ᵖ ; 10ⁿ ÷ 10ᵖ = 10ⁿ⁻ᵖ ; 10⁻ⁿ = 1 ÷ 10ⁿ."],"10³ = 1 000 (trois zéros). Un exposant négatif donne un petit nombre : 10⁻² = 0,01. Pour multiplier, on additionne les exposants : 10⁴ × 10² = 10⁶.<br><br><b>En clair :</b> un exposant positif indique le nombre de zéros. Un exposant négatif indique la position du 1 après la virgule : 10⁻³ = 0,001. Écriture scientifique : 4 500 = 4,5 × 10³."],
["Calcul littéral et équations",["Distributivité : k(a + b) = ka + kb.","Pour résoudre, on fait la même opération des deux côtés de l’égalité."],"Une équation est une balance : ce qu’on fait d’un côté, on le fait de l’autre. Exemple : 2x + 3 = 11 → 2x = 8 (on retire 3) → x = 4 (on divise par 2).<br><br><b>Méthode :</b> 1) Mets les x d’un côté et les nombres de l’autre. 2) Un nombre qui change de côté change de signe. 3) Divise par le nombre devant x. 4) Vérifie en remplaçant x dans l’équation de départ."],
["Fractions",["On additionne après avoir mis au même dénominateur ; on multiplie numérateur × numérateur et dénominateur × dénominateur."],"Exemple : 2/3 + 1/4 → dénominateur commun 12 → 8/12 + 3/12 = 11/12. Pour multiplier, pas besoin de dénominateur commun : 2/3 × 1/4 = 2/12 = 1/6.<br><br><b>Astuce :</b> le dénominateur dit en combien de parts on coupe le tout, le numérateur combien on en prend. Pour un dénominateur commun, cherche un multiple des deux (3 et 4 → 12). À la fin, simplifie en divisant haut et bas par le même nombre."],
["Nombres relatifs",["Addition : même signe → on additionne les distances à zéro et on garde le signe ; signes différents → on soustrait et on garde le signe du nombre le plus éloigné de zéro.","Soustraire, c’est ajouter l’opposé : a − b = a + (−b).","Multiplication et division : signes identiques → résultat positif ; signes différents → résultat négatif."],"Pense à une droite graduée ou à des dettes. −3 + 5 = 2 (on avance de 5 depuis −3). 5 − (−2) = 7 : retirer une dette, c’est gagner. (−4) × (−2) = 8 : deux moins font un plus.<br><br><b>À retenir :</b> mêmes signes → on additionne et on garde le signe : (−2) + (−3) = −5. Signes différents → on soustrait le petit du grand et on garde le signe du plus grand : (−7) + 4 = −3."],
["Proportionnalité",["Un tableau est proportionnel si on passe d’une ligne à l’autre en multipliant par le même coefficient.","Quatrième proportionnelle : produit en croix.","Pourcentage : x % de N = N × x ÷ 100.","Vitesse : v = d ÷ t."],"Si 3 cahiers coûtent 6 €, un cahier coûte 2 €, donc 5 cahiers coûtent 10 €. Un pourcentage est une proportion sur 100 : 25 % de 80 = 80 × 25 ÷ 100 = 20.<br><br><b>Méthode :</b> 1) Trouve la valeur pour 1 (en divisant). 2) Multiplie par la quantité voulue. Ou fais le produit en croix : 3 cahiers → 6 € ; 5 cahiers → ? donc ? = 5 × 6 ÷ 3 = 10 €."],
["Moyenne",["Moyenne = somme des valeurs ÷ nombre de valeurs.","Moyenne pondérée : on multiplie chaque valeur par son coefficient, on additionne, puis on divise par la somme des coefficients.","Étendue = plus grande valeur − plus petite valeur."],"La moyenne partage tout de façon égale. Pondérée : 12 (coef. 1) et 15 (coef. 2) → (12 + 30) ÷ 3 = 14. L’étendue mesure l’écart entre les valeurs extrêmes.<br><br><b>Méthode :</b> 1) Additionne les valeurs. 2) Divise par leur nombre. Pour une moyenne pondérée, multiplie d’abord chaque note par son coefficient, additionne, puis divise par la somme des coefficients (pas par le nombre de notes)."],
["Nombres rationnels",["Un rationnel s’écrit a/b avec b ≠ 0. On simplifie en divisant numérateur et dénominateur par un même nombre : 12/18 = 2/3."]],
["Statistiques et probabilités",["Médiane : valeur qui partage la série ordonnée en deux groupes de même effectif.","Probabilité = cas favorables ÷ cas possibles ; elle est toujours comprise entre 0 et 1."],"<b>Exemple :</b> série 2 ; 4 ; 4 ; 7 ; 9 → moyenne 26 ÷ 5 = 5,2 ; médiane 4 (la valeur du milieu, après avoir rangé la série). Probabilité de tirer une carte rouge dans un jeu de 52 cartes : 26 ÷ 52 = 1/2."],
["Géométrie : espace et transformations",["Pyramide : V = aire de la base × hauteur ÷ 3. Cône : V = π × r² × h ÷ 3.","Translation et rotation conservent les longueurs, les angles et les aires.","Deux triangles sont égaux si leurs côtés sont deux à deux de même longueur."],"<b>À retenir :</b> une translation fait glisser une figure sans la tourner ; une rotation la fait tourner autour d’un point (le centre). La figure garde sa forme et sa taille. Pour le volume d’une pyramide ou d’un cône : base × hauteur ÷ 3."],
["Algorithmique",["Variable : une case mémoire. Boucle « répéter » : on refait des instructions. Condition « si… alors… sinon » : on choisit selon un test."],"<b>Exemple pas à pas :</b> x = 3, on répète 4 fois « ajouter 2 » : 5, 7, 9, 11. Un algorithme est une suite d’ordres précis qu’un ordinateur suit un par un. Pour le vérifier, suis la valeur de chaque variable à chaque étape."],
["Priorités et inéquations",["Ordre des calculs : parenthèses, puissances, puis × et ÷, puis + et −.","Une inéquation se résout comme une équation, mais on change le sens de l’inégalité quand on multiplie ou divise par un nombre négatif."]],
["Fonctions",["Une fonction associe à chaque nombre x un nombre f(x). Une fonction linéaire f(x) = ax traduit une situation de proportionnalité."]],
["Théorème de Thalès",["Si (BC) est parallèle à (MN), alors AM/AB = AN/AC = MN/BC."],"Des parallèles découpent les côtés en proportion. Exemple : AM = 2, AB = 6, AN = 3 → AC = 3 × 6 ÷ 2 = 9. Garde le même ordre des points en haut et en bas des fractions.<br><br><b>Méthode :</b> 1) Vérifie qu’il y a deux droites parallèles. 2) Écris les trois rapports égaux. 3) Garde le rapport dont tu connais trois valeurs sur quatre. 4) Fais le produit en croix."],
["Trigonométrie",["Dans un triangle rectangle : cosinus de l’angle = côté adjacent ÷ hypoténuse."],"L’adjacent est le côté qui touche l’angle sans être l’hypoténuse. Avec la calculatrice (mode degrés), cos⁻¹(0,8) ≈ 37°. On s’en sert pour trouver un angle ou une longueur.<br><br><b>Méthode :</b> 1) Repère l’angle, l’hypoténuse et le côté adjacent. 2) Écris cos(angle) = adjacent ÷ hypoténuse. 3) Pour trouver l’angle, utilise la touche cos⁻¹ de la calculatrice."] ,["Schéma : triangle rectangle (Pythagore)",["ABC est rectangle en A. BC est l’hypoténuse."],"Pythagore : BC² = AB² + AC².",'<svg viewBox="0 0 320 180"><path d="M60 140 L60 40 L240 140 Z" fill="#dbeafe" stroke="#2f6fd6" stroke-width="3"/><path d="M60 120 L80 120 L80 140" fill="none" stroke="#2f6fd6" stroke-width="2"/><text x="45" y="155" fill="currentColor">A</text><text x="45" y="30" fill="currentColor">B</text><text x="250" y="155" fill="currentColor">C</text><text x="35" y="90" fill="currentColor">AB</text><text x="140" y="155" fill="currentColor">AC</text><text x="160" y="75" fill="currentColor">BC</text></svg>']],
q:[["Un triangle rectangle a deux côtés de l’angle droit de 3 cm et 4 cm. Quelle est l’hypoténuse ?",["5 cm","7 cm","6 cm"],0,"3² + 4² = 9 + 16 = 25, et √25 = 5."],
["10³ × 10⁻⁵ = ?",["10⁻²","10⁸","10⁻¹⁵"],0,"On additionne les exposants : 3 + (−5) = −2."],
["Développe 2(x − 5).",["2x − 10","2x − 5","x − 10"],0,"On multiplie chaque terme par 2."],
["2/3 + 1/4 = ?",["11/12","3/7","3/12"],0,"8/12 + 3/12 = 11/12."],
["Résous 2x + 3 = 11.",["x = 4","x = 7","x = 5,5"],0,"2x = 8 donc x = 4."],
["Un triangle a pour côtés 5, 12 et 13. Est-il rectangle ?",["Oui","Non","On ne peut pas savoir"],0,"5² + 12² = 169 = 13² : la réciproque de Pythagore s’applique."],
["(−3) + (−5) = ?",["−8","8","−2"],0,"Même signe : on additionne 3 + 5 et on garde le signe moins."],
["(−7) + 4 = ?",["−3","3","−11"],0,"Signes différents : 7 − 4 = 3, et −7 est le plus éloigné de zéro, donc −3."],
["5 − (−2) = ?",["7","3","−7"],0,"Soustraire −2 revient à ajouter 2 : 5 + 2 = 7."],
["(−6) × (−3) = ?",["18","−18","−9"],0,"Deux signes moins donnent un résultat positif."],
["(−12) ÷ 4 = ?",["−3","3","−8"],0,"Signes différents : résultat négatif."],
["3 stylos coûtent 4,50 €. Combien coûtent 5 stylos ?",["7,50 €","6,75 €","9 €"],0,"Un stylo coûte 4,50 ÷ 3 = 1,50 €, donc 5 × 1,50 = 7,50 €."],
["Combien font 20 % de 150 ?",["30","20","75"],0,"150 × 20 ÷ 100 = 30."],
["Une voiture roule 90 km en 1 h 30. Quelle est sa vitesse moyenne ?",["60 km/h","90 km/h","45 km/h"],0,"1 h 30 = 1,5 h, et 90 ÷ 1,5 = 60."],
["Quelle est la moyenne de 12, 15, 9 et 16 ?",["13","12","13,5"],0,"(12 + 15 + 9 + 16) ÷ 4 = 52 ÷ 4 = 13."],
["Un élève a 10 avec le coefficient 2 et 16 avec le coefficient 3. Quelle est sa moyenne ?",["13,6","13","12"],0,"(10 × 2 + 16 × 3) ÷ 5 = 68 ÷ 5 = 13,6."],
["Quelle est l’étendue de la série 4 ; 9 ; 15 ; 7 ?",["11","15","8,75"],0,"15 − 4 = 11."],
["Simplifie 12/18.",["2/3","3/4","4/9"],0,"On divise le haut et le bas par 6."],
["Quelle est la médiane de 3 ; 5 ; 8 ; 10 ; 12 ?",["8","7,6","10"],0,"La valeur du milieu de la série ordonnée est 8 (7,6 est la moyenne)."],
["On lance un dé équilibré à 6 faces. Probabilité d’obtenir un nombre pair ?",["1/2","1/3","1/6"],0,"3 cas favorables (2, 4, 6) sur 6 cas possibles."],
["Quel est le volume d’une pyramide de base 9 cm² et de hauteur 6 cm ?",["18 cm³","54 cm³","15 cm³"],0,"9 × 6 ÷ 3 = 18."],
["Que conserve une translation ?",["Les longueurs et les angles","Seulement les angles","Rien"],0,"C’est un déplacement sans déformation."],
["x vaut 3. On répète 4 fois « x prend la valeur x + 2 ». Que vaut x à la fin ?",["11","9","14"],0,"3 + 2 + 2 + 2 + 2 = 11."],
["Combien font 3 + 4 × 2 ?",["11","14","10"],0,"La multiplication est prioritaire : 4 × 2 = 8, puis 3 + 8 = 11."],
["Résous −2x < 6.",["x > −3","x < −3","x < 3"],0,"On divise par −2, donc on change le sens : x > −3."],
["Si f(x) = 3x, combien vaut f(4) ?",["12","7","34"],0,"On remplace x par 4 : 3 × 4 = 12."],
["(MN) est parallèle à (BC). AM = 2, AB = 6, AN = 3. Combien vaut AC ?",["9","4","6"],0,"AM/AB = AN/AC donc 2/6 = 3/AC, d’où AC = 9."],
["Dans un triangle rectangle, le côté adjacent mesure 4 et l’hypoténuse 5. Que vaut le cosinus de l’angle ?",["0,8","1,25","0,6"],0,"cos = adjacent ÷ hypoténuse = 4 ÷ 5 = 0,8."]]},
{id:"fr",n:"Français",c:"#c2410c",x:[["Réécris au passif : « Le professeur corrige les copies. »","Les copies sont corrigées par le professeur. Le COD devient sujet, le verbe devient être + participe passé accordé avec ce sujet."],["Conjugue au subjonctif présent : « Il faut que (finir, nous)… » et « Il faut que (faire, tu)… »","Il faut que nous finissions. Il faut que tu fasses."],["Quelle figure de style trouves-tu ? « Ce garçon est un volcan quand il se met en colère. » Justifie.","C’est une métaphore : le garçon est comparé à un volcan sans mot de comparaison. Elle exprime une colère explosive."]],f:[
["Fonctions dans la phrase",["Le COD répond à « qui ? » ou « quoi ? » après le verbe, sans préposition."],"Pose la question après le verbe : « Léa lit un roman » → Léa lit quoi ? un roman = COD. On peut le remplacer par un pronom : elle le lit.<br><br><b>Piège :</b> si une préposition (à, de, pour…) précède le groupe, ce n’est pas un COD mais un COI : « Il parle à Léa »."],
["Temps du récit",["Imparfait : décors, habitudes, actions de fond.","Passé simple : actions principales, ponctuelles."],"L’imparfait pose le décor, le passé simple fait avancer l’histoire. Exemple : Il pleuvait (décor) quand le facteur sonna (action).<br><br><b>Astuce :</b> imparfait = ça dure ou ça se répète. Passé simple = ça arrive d’un coup et l’histoire avance. Passé simple du 1er groupe : il chanta, ils chantèrent."],
["Accord du participe passé",["Avec être : il s’accorde avec le sujet.","Avec avoir : il s’accorde avec le COD placé avant le verbe."],"« Elles sont parties » : sujet féminin pluriel. « Les pommes que j’ai mangées » : le COD « que » (= les pommes) est avant le verbe. « J’ai mangé des pommes » : COD après, donc pas d’accord.<br><br><b>Méthode avec avoir :</b> 1) Cherche le COD. 2) Regarde s’il est placé avant le verbe. 3) Si oui, accorde en genre et en nombre ; sinon, ne change rien."],
["Figures de style",["Comparaison : mot comparatif (comme, tel…).","Métaphore : comparaison sans outil."],"Comparaison : « Il est fort comme un lion. » Métaphore : « Cet homme est un lion. » Personnification : « la mer gronde » (on prête des traits humains à une chose).<br><br><b>Astuce :</b> cherche d’abord un mot de comparaison (comme, tel, semblable à). S’il n’y en a pas et que deux choses sont mises à égalité, c’est une métaphore. Ces figures rendent le texte plus imagé."],
["Subordination",["Une proposition subordonnée dépend d’une principale. Relative : introduite par qui, que, dont. Conjonctive : introduite par que, quand, parce que, bien que…"],"Une subordonnée ne peut pas vivre seule. « Je sais que tu viendras » : « que tu viendras » dépend de « Je sais ». « Le livre qui est sur la table » : « qui est sur la table » complète le nom « livre ».<br><br><b>Méthode :</b> 1) Repère les verbes conjugués : une proposition par verbe. 2) Celle qui commence par qui, que, dont, quand, parce que… est souvent la subordonnée. 3) Celle qui peut vivre seule est la principale."],
["Voix passive",["Le sujet subit l’action : être + participe passé + complément d’agent (par…).","Le chat mange la souris → La souris est mangée par le chat."],"Le COD de l’actif devient le sujet du passif. Le participe passé s’accorde avec ce sujet. L’ancien sujet devient complément d’agent (introduit par « par »).<br><br><b>Étapes :</b> 1) Trouve le sujet, le verbe et le COD. 2) Le COD devient sujet. 3) Écris être au même temps que le verbe + participe passé. 4) Ajoute « par » + ancien sujet. Le chat mangeait la souris → La souris était mangée par le chat."],
["Subjonctif",["Après « il faut que », « bien que », « vouloir que ».","que je sois, que tu aies, qu’il fasse, que nous ayons."],"Le subjonctif exprime un souhait, une obligation ou un doute. On le reconnaît après « il faut que », « je veux que », « bien que » : « Il faut que tu viennes » (et non « viens »).<br><br><b>Astuce :</b> pour la plupart des verbes, prends « ils » au présent et enlève -ent : ils finissent → que je finisse. Irréguliers à connaître : que je sois, que j’aie, que je fasse, que j’aille."],
["Argumenter",["Thèse, arguments, exemples. Connecteurs : d’abord, de plus, cependant, donc."]],
["Les 5 thématiques de l’année",["La fiction pour interroger le réel ; Informer, s’informer, déformer ? ; Dire l’amour ; Individu et société : confrontations de valeurs ? ; La ville, lieu de tous les possibles.","Chacune est étudiée à travers une ou plusieurs œuvres. À l’oral, on s’exprime avec maîtrise devant un auditoire."]],
["Plan des thèmes et des notions",["Se chercher, se construire → Dire l’amour : poésie lyrique, tragédie, comédie, drame romantique.","Vivre en société, participer à la société → Les individus et la société, des confrontations de valeurs : tragi-comédie, nouvelle.","Regarder le monde, inventer des mondes → La fiction pour interroger le réel : roman naturaliste, nouvelle réaliste, nouvelle fantastique.","Agir sur le monde → Informer, s’informer ou déformer ? : presse et médias, propagande, journalisme.","Questionnement complémentaire (Progrès et rêves scientifiques) → La ville dans la littérature."],"<b>Explication :</b> le but est de construire une culture littéraire, pas d’apprendre une liste. Pour chaque genre, pose-toi trois questions : comment le reconnaître ? quel effet cherche-t-il (son registre : tragique, comique, lyrique, fantastique…) ? que veut l’auteur ?<br><br><b>Rappel :</b> le genre est la catégorie de l’œuvre (poésie, théâtre, roman, nouvelle). Le registre est l’effet produit sur le lecteur."],
["Dire l’amour : la poésie lyrique",["Poésie qui exprime les sentiments du poète (amour, joie, mélancolie). Le mot vient de la lyre, instrument qui accompagnait les chants en Grèce antique.","Marques : pronom je, champ lexical des sentiments, exclamations, apostrophes, rimes et rythme (alexandrin = 12 syllabes ; sonnet = 2 quatrains + 2 tercets).","Évolution : troubadours du Moyen Âge, Ronsard et du Bellay (Renaissance), romantiques du XIXe (Hugo, Lamartine, Musset), poètes du XXe (Apollinaire, Éluard)."],"<b>Explication :</b> le poète parle de ce qu’il ressent et veut faire ressentir la même émotion grâce aux images et à la musique des mots.<br><br><b>Exemples :</b> Ronsard compare la femme aimée à une rose qui se fane pour dire que le temps passe (carpe diem). Hugo exprime sa douleur de père dans « Demain, dès l’aube ». Apollinaire pleure un amour perdu dans « Le Pont Mirabeau »."],
["Dire l’amour : la tragédie",["Pièce au dénouement fatal (souvent la mort) qui suscite pitié et crainte. Registre tragique : sentiment de fatalité.","Au XVIIe siècle (Corneille, Racine) : règle des trois unités (un lieu, un jour, une action), bienséance (pas de violence sur scène), langue noble, vers en alexandrins.","Personnages nobles ou héroïques. Thèmes : amour impossible, pouvoir, passion contre devoir, destin, jalousie."],"<b>Explication :</b> les personnages sont pris au piège : quoi qu’ils fassent, ils ne peuvent pas échapper à leur destin. Le spectateur ressent de la compassion (pitié) et la peur que cela lui arrive (crainte).<br><br><b>Exemples :</b> Phèdre (Racine, 1677) : Phèdre, amoureuse de son beau-fils, est détruite par sa passion. Roméo et Juliette (Shakespeare) : un amour condamné par la haine entre deux familles."],
["Dire l’amour : la comédie",["Pièce qui fait rire et finit bien (mariage, réconciliation). Registre comique.","Auteurs : Molière (XVIIe) ; Marivaux et Beaumarchais (XVIIIe).","Genres : comédie de caractères (un défaut exagéré), de mœurs (critique de la société), d’intrigue, sentimentale, farce.","Comique de situation (quiproquo), de mots (jeux de mots), de gestes (coups de bâton), de caractère (défaut grossi)."],"<b>Explication :</b> la comédie fait rire pour corriger les défauts des hommes. Ses personnages sont souvent des types : le valet malin, le père autoritaire, les jeunes amoureux.<br><br><b>Exemples :</b> Molière, L’Avare (comique de caractère). Marivaux, Le Jeu de l’amour et du hasard (1730) : maîtres et valets échangent leurs rôles. Beaumarchais, Le Mariage de Figaro (1784) : le valet se moque de son maître."],
["Dire l’amour : le drame romantique",["Pièce du XIXe siècle qui mélange tragique et comique, sublime et grotesque, et refuse les règles classiques.","Auteurs : Victor Hugo (Hernani, Ruy Blas), Musset (Lorenzaccio), Dumas.","Particularités : plusieurs lieux et plusieurs temps, personnages de toutes conditions, vers et prose mélangés, scènes d’action (duels, morts).","Thèmes : passion, fatalité, révolte, histoire, mal du siècle."],"<b>Explication :</b> les romantiques veulent peindre la vie telle qu’elle est, où le beau et le laid, le sérieux et le comique se côtoient.<br><br><b>Exemples :</b> Hernani (Hugo, 1830) a provoqué une véritable bataille entre classiques et romantiques. Ruy Blas (1838) : un valet amoureux d’une reine. Lorenzaccio : un jeune homme décide de tuer un tyran."],
["Individu et société : la tragi-comédie",["Pièce qui mélange tragique et comique : dangers et duels, mais dénouement heureux.","Caractéristiques : intrigue à rebondissements, péril de mort évité, personnages nobles, plusieurs lieux et temps.","Très en vogue au début du XVIIe siècle, avant la tragédie classique ; l’esprit réapparaît au XXe siècle.","Utile pour mettre en scène des conflits de valeurs (honneur, amour, devoir, liberté)."],"<b>Explication :</b> on y trouve la tension de la tragédie, mais le malheur est finalement évité. Cela permet de montrer des conflits de valeurs sans que tout finisse mal.<br><br><b>Exemples :</b> Le Cid (Corneille, 1637), d’abord présenté comme une tragi-comédie : Rodrigue doit choisir entre venger l’honneur de son père et son amour pour Chimène (dilemme cornélien), puis le roi laisse espérer leur mariage. Cyrano de Bergerac (Rostand, 1897) mêle humour, héroïsme et émotion."],
["Individu et société : la nouvelle",["Récit bref (quelques pages), peu de personnages, une seule intrigue, et une chute (fin inattendue).","Spécificités : narration concentrée, rythme rapide, tous les détails mènent à la chute.","Évolution : origines italiennes (Boccace), âge d’or au XIXe (Maupassant, Mérimée, Balzac, Poe), puis XXe (Buzzati) ; nouvelles réalistes, fantastiques, policières, de science-fiction."],"<b>Explication :</b> comme la nouvelle est courte, chaque détail compte. La chute donne un nouveau sens à toute l’histoire.<br><br><b>Exemples :</b> La Parure (Maupassant, 1884) : une femme s’endette pour remplacer un collier perdu, et apprend à la fin qu’il était faux. Mateo Falcone (Mérimée) : un père doit choisir entre l’honneur et son fils."],
["Fiction et réel : le roman naturaliste",["Roman de la fin du XIXe siècle qui décrit la réalité sociale sans l’embellir, avec une méthode presque scientifique : observation, enquête, documentation.","Chef de file : Émile Zola (cycle des Rougon-Macquart), avec Maupassant, Daudet, les Goncourt.","Milieux populaires, influence de l’hérédité et du milieu, descriptions précises, narration objective.","Objectif : montrer la vérité et dénoncer l’injustice (misère, alcoolisme, travail)."],"<b>Explication :</b> Zola observe un milieu, prend des notes sur le terrain, puis montre comment la société et l’hérédité façonnent les personnages. Le but est de dire le vrai, même si cela choque.<br><br><b>Exemples :</b> Germinal (1885) : la vie et la grève des mineurs du Nord. L’Assommoir (1877) : la chute d’une blanchisseuse causée par la misère et l’alcool."],
["Fiction et réel : la nouvelle réaliste",["Récit bref qui reproduit la réalité de façon crédible : lieux, époque et personnages vraisemblables.","Moyens : descriptions précises, portraits physiques et moraux, dialogues crédibles, narrateur discret.","Effet de réel : des détails vrais donnent l’impression que l’histoire est véridique. Auteurs : Maupassant, Balzac, Mérimée, Flaubert."],"<b>Explication :</b> l’auteur veut que le lecteur croie à l’histoire. Il peint la société de son temps avec des personnages ordinaires ; le portrait révèle le caractère.<br><br><b>Exemples :</b> La Parure décrit le monde des petits employés et le désir de paraître. Dans Boule de Suif (Maupassant, 1880), la guerre de 1870 sert de cadre pour montrer l’hypocrisie de bourgeois."],
["Fiction et réel : la nouvelle fantastique",["Récit où un événement inexplicable surgit dans un monde réaliste ; le héros et le lecteur hésitent entre explication rationnelle (rêve, folie) et explication surnaturelle.","Caractéristiques : cadre quotidien, narrateur souvent à la 1re personne, atmosphère d’angoisse, fin ambiguë.","Thèmes : le double, le fantôme, la folie, les êtres invisibles, le rêve. Auteurs : Maupassant, Poe, Mérimée, Gautier."],"<b>Explication :</b> le fantastique repose sur le doute. Si tout s’explique, on est dans le réalisme ; si le surnaturel est accepté comme normal, on passe au merveilleux (contes).<br><br><b>Exemples :</b> Le Horla (Maupassant) : un homme se croit persécuté par un être invisible, est-ce de la folie ? La Vénus d’Ille (Mérimée) : une statue semble s’animer. Le Chat noir (Poe) : une plongée dans la folie et la culpabilité."],
["Informer ou déformer : la presse et les médias",["Média : moyen de communication de masse (presse écrite, radio, télévision, Internet, réseaux sociaux). Presse : journaux et magazines.","Chaque média a ses spécificités : presse (analyse), radio (immédiat, voix), télévision (images, émotion), Internet (rapidité, interactivité).","Un même fait est traité différemment selon le média : titre, image, angle, ton, ligne éditoriale.","Vérifier une info : source, date, auteur, fait ou opinion, comparer plusieurs sources. Fake news : fausse information diffusée."],"<b>Explication :</b> l’information n’est jamais complètement neutre : un média choisit ce qu’il montre et comment. Comparer les médias aide à se faire une opinion libre.<br><br><b>Exemples :</b> un même match peut faire la une d’un journal sportif et seulement quelques lignes dans un quotidien national. Pour vérifier une rumeur, cherche la source d’origine et compare-la avec deux autres sites fiables."],
["Informer ou déformer : la propagande",["Propagande : moyens (affiches, discours, films, slogans) utilisés pour influencer l’opinion et faire adhérer à une idée ou à un pouvoir.","Procédés : slogans simples et répétés, images fortes, appel aux émotions (peur, fierté), désignation d’un ennemi, culte du chef, censure.","Deux usages : valoriser et encourager les individus (mobilisation en temps de guerre) ou mener à la dictature (régimes totalitaires)."],"<b>Explication :</b> la propagande ne cherche pas à informer mais à convaincre, parfois en déformant la réalité. Demande-toi : qui parle ? à qui ? avec quel moyen ? quel but ?<br><br><b>Exemples :</b> pendant la guerre de 1914-1918, des affiches appelaient à souscrire à l’emprunt national. Dans 1984 (Orwell), le pouvoir contrôle les esprits avec un langage officiel et un chef omniprésent. Dans La Ferme des animaux (Orwell), des slogans simples manipulent les animaux."],
["Informer ou déformer : le journalisme",["Journalisme : métier qui recherche, vérifie et diffuse des informations. Principes : vérifier les faits, croiser les sources, respecter la déontologie.","Représentation positive : le journaliste qui révèle la vérité et défend la démocratie.","Représentation négative : le journaliste qui cherche le scoop, manipule ou envahit la vie privée.","Cinéma et littérature dénoncent les dérives : sensationnalisme, pouvoir de l’argent, fausses nouvelles."],"<b>Explication :</b> une œuvre peut montrer le journalisme comme on voudrait qu’il soit (indépendant, courageux) ou comme il peut devenir (manipulateur). Dans les deux cas, elle fait réfléchir au rôle de la presse.<br><br><b>Exemples :</b> Citizen Kane (1941) montre un magnat de la presse qui utilise ses journaux pour son pouvoir. Les Hommes du président (1976) raconte l’enquête de deux journalistes sur le Watergate. Bel-Ami (Maupassant, 1885) : un journaliste ambitieux se sert de la presse pour s’élever."],
["La ville dans la littérature",["La ville est un lieu réel et imaginé : décor, personnage, symbole de progrès, de liberté, mais aussi de solitude ou de danger.","Sujet de romans : Paris chez Balzac, Hugo (Notre-Dame de Paris), Zola (Au Bonheur des Dames).","Source d’inspiration des poètes : Baudelaire (Tableaux parisiens), Apollinaire, Verlaine ; foule, solitude, modernité.","Roman policier : lieu de l’enquête, quartiers dangereux, anonymat de la foule (Conan Doyle, Simenon).","Photographie et cinéma : la ville comme décor et comme personnage (Doisneau, Brassaï)."],"<b>Explication :</b> la ville fascine : elle promet travail, rencontres et culture, mais peut aussi être source d’inégalités et d’isolement. Les auteurs l’utilisent pour montrer la société et les sentiments des personnages.<br><br><b>Exemples :</b> Notre-Dame de Paris (Hugo, 1831) fait de la cathédrale et du Paris médiéval de vrais personnages. Dans Au Bonheur des Dames (Zola), un grand magasin symbolise la modernité. Sherlock Holmes enquête dans le brouillard de Londres. Doisneau photographie Paris, notamment « Le Baiser de l’Hôtel de Ville »."]],
q:[["Dans « Il chante une chanson », quel est le COD ?",["une chanson","Il","chante"],0,"On demande : il chante quoi ? Une chanson."],
["Passé simple de « chanter » à la 3e personne du singulier ?",["il chanta","il chantait","il a chanté"],0,"Chanter → il chanta."],
["« Elles sont parti… » : quelle orthographe ?",["parties","partis","parti"],0,"Avec être, accord avec le sujet féminin pluriel."],
["« Ses joues étaient rouges comme des tomates » est…",["une comparaison","une métaphore","une personnification"],0,"Le mot « comme » introduit la comparaison."],
["À quoi sert surtout l’imparfait dans un récit ?",["Décrire le décor et les actions de fond","Raconter l’action principale","Parler du futur"],0,"L’imparfait installe l’arrière-plan."],
["Quelle est la nature de « rapidement » ?",["adverbe","adjectif","nom"],0,"Il est invariable et modifie un verbe."],
["Quelle phrase est au passif ?",["Le voleur a été arrêté par la police.","La police arrête le voleur.","Le voleur arrête la police."],0,"Schéma : être + participe passé + par…"],
["Il faut que tu ___ patient. (être)",["sois","es","seras"],0,"« Il faut que » est suivi du subjonctif."],
["Il faut que nous ___ du courage. (avoir)",["ayons","avons","aurons"],0,"Subjonctif présent : que nous ayons."],
["Dans « Le livre que je lis est passionnant », « que je lis » est…",["une subordonnée relative","une proposition principale","un COD"],0,"Elle complète le nom « livre »."],
["Quel connecteur marque l’opposition ?",["cependant","donc","de plus"],0,"Il oppose deux idées."],
["Quelle thématique du programme interroge l’information et les fausses informations ?",["Informer, s’informer, déformer ?","Dire l’amour","La ville, lieu de tous les possibles"],0,"Elle porte sur la fabrication et la déformation de l’information."],
["Dans un texte argumentatif, à quoi servent les exemples ?",["À illustrer et appuyer un argument","À remplacer la thèse","À conclure sans argument"],0,"Chaque argument est soutenu par un exemple."],
["Quelle est la règle des trois unités au théâtre classique ?",["Un lieu, un jour, une action","Un auteur, un acteur, un public","Un acte, une scène, un vers"],0,"Elle structure la tragédie du XVIIe siècle."],
["Quel auteur a écrit la tragédie Phèdre ?",["Racine","Molière","Hugo"],0,"Racine est un grand auteur de tragédies."],
["Que mélange le drame romantique ?",["Le tragique et le comique","Le fantastique et le merveilleux","Le réel et le virtuel"],0,"Hugo parle de mélange du sublime et du grotesque."],
["Quel écrivain est le chef de file du roman naturaliste ?",["Émile Zola","Victor Hugo","Jean Racine"],0,"Il a écrit les Rougon-Macquart, dont Germinal."],
["Que ressent le lecteur d’une nouvelle fantastique ?",["L’hésitation entre explication rationnelle et surnaturelle","La certitude que tout est magique","La certitude que tout est un rêve"],0,"Le doute est la base du fantastique."],
["Qu’est-ce que la chute d’une nouvelle ?",["Le dénouement final inattendu","Le titre","La première phrase"],0,"Elle donne un nouveau sens au récit."],
["Qui a écrit Le Mariage de Figaro ?",["Beaumarchais","Molière","Marivaux"],0,"La pièce date de 1784."],
["Quel est l’objectif principal de la propagande ?",["Influencer l’opinion","Informer de façon neutre","Divertir"],0,"Elle cherche à convaincre, parfois en déformant la réalité."],
["Quel poète a écrit les Tableaux parisiens ?",["Baudelaire","Ronsard","Racine"],0,"Il met en scène Paris et la foule."],
["Quel roman de Zola raconte la vie des mineurs ?",["Germinal","L’Assommoir","Bel-Ami"],0,"Germinal décrit la grève des mineurs."]]},
{id:"hg",n:"Histoire-Géo",c:"#7c3aed",x:[["Calcule la densité d’un pays de 90 millions d’habitants sur 450 000 km².","90 000 000 ÷ 450 000 = 200 hab./km²."],["Explique en 3 lignes ce qu’est le commerce triangulaire.","Des navires partent d’Europe avec des marchandises, échangées en Afrique contre des captifs. Ceux-ci sont déportés vers les Amériques (Passage du Milieu) pour travailler dans les plantations. Les navires reviennent avec sucre, café ou coton."],["Cite 3 causes humaines du réchauffement climatique et 2 conséquences.","Causes : combustion du pétrole, du gaz et du charbon ; déforestation ; élevage et industrie (CO₂, méthane). Conséquences : fonte des glaciers, montée du niveau des mers, canicules."]],f:[
["Lumières et Révolution",["Montesquieu, Voltaire, Rousseau, Diderot défendent liberté et égalité.","1789 : prise de la Bastille (14 juillet) et Déclaration des droits de l’homme (26 août)."],"Les philosophes veulent faire progresser la société grâce à la raison. Leurs idées (égalité, séparation des pouvoirs) inspirent la Révolution de 1789, qui met fin à l’Ancien Régime.<br><br><b>Repères :</b> sous l’Ancien Régime, le roi a tous les pouvoirs et la société est divisée en trois ordres (clergé, noblesse, tiers état). En 1789, le tiers état se révolte et réclame liberté et égalité."],
["Empire et XIXe siècle",["1804 : Napoléon Ier est sacré empereur.","La révolution industrielle naît en Angleterre."]],
["Géographie",["Mobilités humaines, migrations, tourisme et urbanisation sont les grands thèmes."]],
["La traite négrière",["Du XVIe au XIXe siècle, environ 12 millions d’Africains sont déportés vers les Amériques.","Commerce triangulaire : Europe → Afrique → Amériques → Europe. La traversée de l’Atlantique s’appelle le Passage du Milieu.","Ports négriers français : Nantes, Bordeaux, La Rochelle. Le Code noir (1685) encadre l’esclavage dans les colonies.","Abolition définitive en France en 1848, avec Victor Schoelcher."],"Des navires partent d’Europe avec des marchandises, achètent des captifs en Afrique, les transportent aux Amériques, puis rapportent sucre, café ou coton en Europe. La traite a enrichi des ports comme Nantes.<br><br><b>Repères :</b> les captifs voyagent entassés dans des conditions terribles et beaucoup meurent pendant la traversée. Ils sont ensuite vendus et forcés de travailler dans les plantations."],
["La densité de population",["Densité = nombre d’habitants ÷ superficie, en hab./km².","La population est très inégalement répartie : fortes densités en Asie de l’Est, en Asie du Sud, en Europe ; faibles densités dans les déserts, les montagnes et les forêts."],"Exemple : 60 millions d’habitants sur 600 000 km² → 100 hab./km². La densité est une moyenne : elle cache les écarts entre une ville et la campagne.<br><br><b>Méthode :</b> 1) Prends le nombre d’habitants. 2) Divise par la superficie en km². 3) Écris le résultat en hab./km². Plus il est grand, plus le territoire est peuplé."],
["Le réchauffement climatique",["Il vient surtout des gaz à effet de serre (CO₂, méthane) émis par les activités humaines, en particulier la combustion des énergies fossiles.","Conséquences : fonte des glaciers, montée du niveau des mers, événements extrêmes (canicules, tempêtes).","Réponses : accord de Paris (2015), transition énergétique, adaptation des territoires."],"Les gaz à effet de serre retiennent la chaleur comme les vitres d’une serre : plus on en émet, plus la température moyenne monte. Agir, c’est réduire les émissions et s’adapter aux effets.<br><br><b>Chaîne à retenir :</b> énergies fossiles brûlées → plus de CO₂ → plus de chaleur retenue → glaciers qui fondent → mers qui montent et climat plus extrême. L’accord de Paris vise une hausse bien en dessous de 2 °C."],
["L’indice de développement humain (IDH)",["Créé par le PNUD (ONU), il compare les pays avec 3 critères : santé (espérance de vie), éducation, niveau de vie (revenu par habitant).","Sa valeur est comprise entre 0 et 1 : plus elle est proche de 1, plus le développement est élevé."],"Le revenu seul ne suffit pas : l’IDH ajoute la santé et l’éducation. Deux pays au revenu proche peuvent avoir un IDH différent.<br><br><b>Pour lire un classement :</b> un IDH proche de 1 signifie santé, éducation et niveau de vie élevés ; un IDH faible signifie que les besoins de base sont mal couverts. Compare plusieurs pays pour voir les écarts."],
["L’urbanisation",["Plus de la moitié de la population mondiale vit aujourd’hui en ville.","Les métropoles concentrent habitants, emplois et pouvoirs. Défis : étalement urbain, pollution, bidonvilles (habitats précaires)."],"<b>Idée simple :</b> l’urbanisation, c’est la part des habitants qui vivent en ville, et elle augmente. Une métropole attire par ses emplois et ses services, mais pose des problèmes de logement, de transports et de pollution."],
["La mondialisation",["Intensification des échanges de marchandises, de capitaux, d’informations et de personnes.","L’essentiel des marchandises voyage par mer, en porte-conteneurs. Les firmes transnationales produisent et vendent dans plusieurs pays."],"<b>Exemple :</b> un téléphone est conçu aux États-Unis, assemblé en Asie avec des pièces de plusieurs pays, puis vendu partout. Les transports maritimes et Internet rendent ces échanges rapides et peu coûteux."],
["Mobilités humaines transnationales",["Un migrant quitte son pays pour s’installer dans un autre. Les mobilités incluent aussi le tourisme, les études et les déplacements professionnels.","Causes des migrations : travail, études, conflits, risques climatiques."]],
["La France au XIXe siècle",["L’industrialisation et l’exode rural transforment la société.","Le suffrage universel masculin est instauré en 1848 ; la IIIe République s’installe après 1870.","Avec Jules Ferry (années 1880), l’école devient gratuite, laïque et obligatoire."]]],
q:[["Quand a eu lieu la prise de la Bastille ?",["14 juillet 1789","4 août 1792","1er mai 1848"],0,"C’est le début symbolique de la Révolution."],
["Qui a écrit « De l’esprit des lois » ?",["Montesquieu","Voltaire","Diderot"],0,"Il y défend la séparation des pouvoirs."],

["Dans quel pays commence la révolution industrielle ?",["Angleterre","France","Allemagne"],0,"Machine à vapeur, charbon, textile."],
["Quand l’esclavage est-il aboli définitivement en France ?",["1848","1789","1804"],0,"Le décret est signé sous la IIe République."],
["La Déclaration des droits de l’homme et du citoyen date de…",["1789","1799","1815"],0,"Elle est adoptée le 26 août 1789."],
["Quels continents le commerce triangulaire relie-t-il ?",["L’Europe, l’Afrique et les Amériques","L’Europe, l’Asie et l’Océanie","L’Afrique, l’Asie et l’Amérique du Sud seulement"],0,"Les navires partent d’Europe, passent par l’Afrique, puis vont aux Amériques."],
["Comment appelle-t-on la traversée de l’Atlantique par les navires négriers ?",["Le Passage du Milieu","La Route des Indes","Le Grand Voyage"],0,"C’est la partie la plus meurtrière du voyage."],

{id:"en",n:"Anglais (LV1)",c:"#0f766e",x:[["Complète avec have ou has : She ___ lived in Lyon since 2019. They ___ never been to London.","She has lived… (she → has). They have never been… (they → have)."],["Écris des phrases avec le comparatif : Tom / Paul (tall) ; this book / that film (interesting).","Tom is taller than Paul. This book is more interesting than that film."],["Traduis : « Il est interdit de manger ici. »","You mustn’t eat here."]],f:[
["Present perfect",["have/has + participe passé. Avec since (point de départ) et for (durée)."],"On relie le passé au présent : I have lived here for 3 years (j’y habite encore). Since 2020 = depuis 2020 ; for 3 years = pendant 3 ans. Participes irréguliers : go → gone, see → seen.<br><br><b>Construction :</b> I/you/we/they have + participe passé ; he/she/it has + participe passé. Négation : haven’t / hasn’t. Question : Have you ever been to London ?"],
["Comparatifs",["Court : taller than. Long : more interesting than. Irréguliers : good → better, bad → worse."],"<b>Règle :</b> mot court → -er + than (taller than). Mot long → more + mot + than (more interesting than). Irréguliers : good → better, bad → worse, far → further."],
["Modaux",["must = obligation ; mustn’t = interdiction ; can/could = capacité."]],
["Voyages et innovation",["to travel = voyager ; a journey = un trajet ; an invention = une invention ; an inventor = un inventeur.","has been to = est allé et revenu ; has gone to = est parti (et n’est pas revenu)."]],

{id:"svt",n:"SVT",c:"#15803d",x:[["Quelle est la différence entre le foyer et l’épicentre d’un séisme ?","Le foyer est le point de départ de la rupture, sous terre. L’épicentre est le point de la surface juste au-dessus du foyer, où les dégâts sont souvent les plus forts."],["Un volcan projette violemment des cendres et des gaz. Quel type d’éruption est-ce ? Justifie.","Une éruption explosive : la lave est visqueuse, elle piège les gaz qui finissent par exploser."],["Décris le trajet d’un message nerveux quand tu touches une plaque chaude.","Récepteurs de la peau → nerfs → moelle épinière → cerveau → ordre envoyé aux muscles → retrait de la main."]],f:[
["Tectonique des plaques",["La lithosphère est découpée en plaques qui bougent.","Séismes et volcans se situent surtout aux limites des plaques.","Types de limites : divergentes (les plaques s’écartent, ce qui forme les dorsales océaniques), convergentes (elles se rapprochent : une plaque plonge sous l’autre, c’est la subduction, ou bien des montagnes se forment), transformantes (elles coulissent).","Structure du globe : croûte, manteau, noyau. La lithosphère (croûte + haut du manteau, rigide) repose sur une couche plus malléable.","Dérive des continents : idée d’Alfred Wegener (1912) ; les continents se déplacent très lentement."],"Les plaques bougent de quelques centimètres par an. Quand elles se frottent ou se heurtent, les tensions s’accumulent puis se libèrent brutalement : c’est un séisme. Exemple : la ceinture de feu du Pacifique.<br><br><b>Schéma mental :</b> la croûte terrestre est cassée en grandes plaques posées sur le manteau. Aux limites, elles se rapprochent, s’éloignent ou glissent : c’est là que naissent séismes et volcans.<br><br><b>Exemples :</b> l’océan Atlantique s’élargit d’environ 2 cm par an. Quand l’Inde a heurté l’Asie, l’Himalaya s’est formé. Autour du Pacifique, des plaques plongent les unes sous les autres : c’est la ceinture de feu, avec de nombreux volcans et séismes (Japon, Chili).","<svg viewBox='0 0 300 140' role='img' aria-label='Deux plaques qui se rapprochent au-dessus du manteau'><rect y='78' width='300' height='62' fill='#e0792a' fill-opacity='.5'/><rect x='6' y='56' width='136' height='22' rx='3' fill='#8d6e4a'/><rect x='158' y='56' width='136' height='22' rx='3' fill='#5f8a5a'/><path d='M60 46h60l-8-6m8 6l-8 6M240 46h-60l8-6m-8 6l8 6' stroke='currentColor' stroke-width='2' fill='none'/><text x='150' y='20' font-size='12' text-anchor='middle' fill='currentColor'>Plaques lithosphériques</text><text x='150' y='115' font-size='12' text-anchor='middle' fill='currentColor'>Manteau</text></svg>"],
["Séisme",["Le foyer est le point de départ sous terre ; l’épicentre est au-dessus, en surface.","Séisme : vibration du sol due à une rupture brutale de roches le long d’une faille, qui libère de l’énergie sous forme d’ondes sismiques.","Magnitude : mesure l’énergie libérée (échelle de Richter). Intensité : mesure les effets ressentis et les dégâts. Sismographe : appareil qui enregistre les ondes.","Risques : on ne peut pas prévoir un séisme, mais on peut s’en protéger (constructions parasismiques, plans d’évacuation, bons gestes)."],"<b>Explication :</b> quand les plaques se poussent, les roches se déforment lentement ; quand leur résistance est dépassée, elles cassent d’un coup et les ondes se propagent comme des ronds dans l’eau à partir du foyer.<br><br><b>Exemples :</b> si le foyer est à 10 km de profondeur, l’épicentre est le point de la surface juste au-dessus. Un séisme de magnitude 7 libère environ 32 fois plus d’énergie qu’un séisme de magnitude 6. Au Japon, les bâtiments sont conçus pour se déformer sans s’effondrer. Bons gestes : se mettre à l’abri sous une table solide, s’éloigner des vitres, ne pas prendre l’ascenseur.","<svg viewBox='0 0 300 140' role='img' aria-label='Coupe du sol avec le foyer sous terre et l’épicentre en surface'><rect y='40' width='300' height='100' fill='#8d6e4a' fill-opacity='.45'/><circle cx='150' cy='110' r='24' fill='none' stroke='#c93a45'/><circle cx='150' cy='110' r='44' fill='none' stroke='#c93a45' stroke-dasharray='4 3'/><circle cx='150' cy='110' r='7' fill='#c93a45'/><path d='M150 103V45' stroke='currentColor' stroke-dasharray='3 3'/><circle cx='150' cy='40' r='5' fill='currentColor'/><text x='164' y='116' font-size='12' fill='currentColor'>Foyer</text><text x='164' y='34' font-size='12' fill='currentColor'>Épicentre</text></svg>"],
["Reproduction humaine",["La puberté est déclenchée par des hormones.","La fécondation unit un spermatozoïde et un ovule.","Puberté : période où le corps devient capable de se reproduire (caractères sexuels secondaires, règles chez la fille, production de spermatozoïdes chez le garçon).","Gamètes : cellules reproductrices, spermatozoïde (mâle) et ovule (femelle). Cycle menstruel : environ 28 jours, avec une ovulation vers le milieu.","Contraception : méthodes pour éviter une grossesse. Le préservatif protège aussi des infections sexuellement transmissibles (IST)."],"À la puberté, les organes reproducteurs deviennent fonctionnels. La cellule-œuf formée à la fécondation contient l’information génétique des deux parents.<br><br><b>Étapes :</b> puberté → production de spermatozoïdes et d’ovules → rencontre des deux cellules → fécondation → cellule-œuf → embryon, puis fœtus.<br><br><b>Exemples :</b> la fécondation a lieu dans l’oviducte ; la cellule-œuf se divise, puis s’installe dans l’utérus. La grossesse dure environ 9 mois. Le préservatif est le seul moyen qui protège à la fois d’une grossesse et des IST.","<svg viewBox='0 0 300 140' role='img' aria-label='Des spermatozoïdes qui approchent un ovule'><circle cx='210' cy='65' r='40' fill='#ec4899' fill-opacity='.3' stroke='currentColor'/><circle cx='210' cy='65' r='12' fill='#c2410c' fill-opacity='.6'/><g stroke='currentColor' fill='none' stroke-width='2'><path d='M30 35q25-20 50 0t50 5'/><path d='M30 95q25-20 50 0t50 5'/></g><circle cx='134' cy='40' r='5' fill='currentColor'/><circle cx='134' cy='100' r='5' fill='currentColor'/><text x='210' y='127' font-size='12' text-anchor='middle' fill='currentColor'>Ovule</text><text x='80' y='127' font-size='12' text-anchor='middle' fill='currentColor'>Spermatozoïdes</text></svg>"],
["Diversité du vivant",["Une espèce regroupe des individus qui peuvent se reproduire entre eux et avoir des descendants fertiles.","La biodiversité est la variété des espèces, des milieux et des gènes.","Classification : on range les êtres vivants en groupes emboîtés (comme des poupées russes) selon leurs caractères communs.","Parenté : plus deux espèces ont de caractères communs hérités d’un ancêtre commun, plus elles sont proches. Exemple : tous les vertébrés ont une colonne vertébrale.","Évolution : les espèces changent au fil des générations ; la sélection naturelle favorise les individus les mieux adaptés à leur milieu."],"<b>Explication :</b> pour s’y retrouver parmi des millions d’espèces, on classe selon les caractères hérités d’un ancêtre commun, pas selon l’apparence ni le milieu de vie.<br><br><b>Exemples :</b> la baleine vit dans l’eau mais c’est un mammifère (poumons, mamelles), pas un poisson. Le chat et le tigre sont deux espèces proches du groupe des félins. Chez la phélène du bouleau, les papillons sombres ont été favorisés dans les zones polluées : c’est la sélection naturelle.","<svg viewBox='0 0 300 140' role='img' aria-label='Groupes emboîtés : êtres vivants, animaux, vertébrés, mammifères'><g fill='#15803d' stroke='#15803d'><rect x='4' y='4' width='292' height='132' rx='14' fill-opacity='.1'/><rect x='24' y='26' width='252' height='100' rx='12' fill-opacity='.15'/><rect x='44' y='48' width='212' height='70' rx='10' fill-opacity='.2'/><rect x='64' y='70' width='172' height='40' rx='8' fill-opacity='.3'/></g><g font-size='12' fill='currentColor'><text x='14' y='20'>Êtres vivants</text><text x='34' y='42'>Animaux</text><text x='54' y='64'>Vertébrés</text><text x='150' y='95' text-anchor='middle'>Mammifères</text></g></svg>"],
["Enjeux environnementaux",["Menaces sur la biodiversité : destruction des habitats, pollution, surexploitation. Agir : protéger les milieux, réduire son empreinte écologique.","Écosystème : un milieu (biotope) et les êtres vivants qui y vivent (biocénose), reliés entre eux, par exemple par des chaînes alimentaires.","Impact de l’être humain : urbanisation, agriculture intensive, pollution, espèces invasives, changement climatique.","Développement durable : répondre aux besoins d’aujourd’hui sans compromettre ceux des générations futures. Gestes : trier, économiser l’eau et l’énergie, manger local et de saison."],"<b>Explication :</b> dans un écosystème, tout est lié : si une espèce disparaît, d’autres peuvent être touchées.<br><br><b>Exemples :</b> si les abeilles disparaissent, beaucoup de plantes ne sont plus pollinisées, donc il y a moins de fruits. Un étang pollué par des engrais manque de dioxygène et les poissons meurent. Une prairie fleurie laissée sans tonte accueille insectes, oiseaux et petits mammifères.","<svg viewBox='0 0 300 95' role='img' aria-label='Chaîne alimentaire : plante, insecte, oiseau'><g font-size='12' text-anchor='middle' fill='currentColor'><rect x='6' y='28' width='80' height='34' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='46' y='50'>Plante</text><rect x='110' y='28' width='80' height='34' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='150' y='50'>Insecte</text><rect x='214' y='28' width='80' height='34' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='254' y='50'>Oiseau</text><text x='150' y='16'>Chaîne alimentaire</text><text x='150' y='85' font-size='11'>Si un maillon disparaît, tous sont touchés</text></g><path d='M88 45h20l-6-5m6 5l-6 5M192 45h20l-6-5m6 5l-6 5' stroke='currentColor' stroke-width='2' fill='none'/></svg>"],
["Système nerveux",["Le cerveau reçoit des messages nerveux des organes des sens, les traite et envoie des ordres aux muscles.","Les neurones transmettent le message nerveux ; la moelle épinière relie le cerveau aux nerfs.","Organes des sens : leurs récepteurs (œil, oreille, peau, langue, nez) captent les informations du milieu et les transforment en messages nerveux.","Nerfs sensitifs : portent le message des récepteurs vers le centre nerveux. Nerfs moteurs : portent l’ordre vers les muscles. Centres nerveux : cerveau et moelle épinière.","Réflexe : réaction involontaire et très rapide, commandée par la moelle épinière sans attendre le cerveau.","Hygiène : le sommeil, les écrans, l’alcool et les drogues influencent le fonctionnement du cerveau."],"Exemple : tu touches une plaque chaude → la peau envoie un message nerveux au cerveau, qui ordonne aux muscles de retirer la main.<br><br><b>À retenir :</b> récepteurs (sens) → nerfs sensitifs → cerveau ou moelle épinière → nerfs moteurs → muscles. Un réflexe est une réaction rapide, sans réfléchir, qui passe par la moelle épinière.<br><br><b>Exemples :</b> tu freines à vélo quand un chien traverse : œil (récepteur) → nerf sensitif → cerveau → nerf moteur → muscles de la main. Si tu te pinces, la main se retire avant que tu sentes la douleur : c’est un réflexe. Manquer de sommeil ralentit les temps de réaction.","<svg viewBox='0 0 300 120' role='img' aria-label='Trajet du message nerveux : récepteur, nerf sensitif, centre nerveux, nerf moteur, muscle'><g font-size='11' text-anchor='middle' fill='currentColor'><rect x='6' y='10' width='88' height='30' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='50' y='30'>Récepteur</text><rect x='106' y='10' width='88' height='30' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='150' y='30'>Nerf sensitif</text><rect x='206' y='10' width='88' height='30' rx='8' fill='#c2410c' fill-opacity='.25' stroke='#c2410c'/><text x='250' y='30'>Centre nerveux</text><rect x='206' y='80' width='88' height='30' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='250' y='100'>Nerf moteur</text><rect x='106' y='80' width='88' height='30' rx='8' fill='#15803d' fill-opacity='.25' stroke='#15803d'/><text x='150' y='100'>Muscle</text></g><path d='M96 25h8l-5-4m5 4l-5 4M196 25h8l-5-4m5 4l-5 4M250 42v36l-4-6m4 6l4-6M204 95h-8l5-4m-5 4l5 4' stroke='currentColor' stroke-width='2' fill='none'/></svg>"],
["Transmission de la vie",["Les testicules produisent les spermatozoïdes ; les ovaires produisent les ovules.","Après la fécondation, la cellule-œuf se divise pour former l’embryon.","Appareil reproducteur masculin : testicules, canaux déférents, pénis. Féminin : ovaires, oviductes, utérus, vagin.","ADN et chromosomes : le noyau de chaque cellule contient l’information génétique (ADN, organisée en chromosomes) ; la cellule-œuf reçoit la moitié de chaque parent.","Hérédité : les caractères (couleur des yeux…) se transmettent des parents aux enfants par les gènes."],"<b>Explication :</b> chaque gamète porte la moitié de l’information génétique ; à la fécondation, les deux moitiés s’unissent et reforment une cellule complète, différente de celle des parents.<br><br><b>Exemples :</b> une cellule humaine a 46 chromosomes, un gamète en a 23, la cellule-œuf 23 + 23 = 46. Un enfant ressemble à ses parents sans être identique, car il reçoit un mélange de gènes des deux. Les vrais jumeaux viennent d’une même cellule-œuf, les faux jumeaux de deux.","<svg viewBox='0 0 300 90' role='img' aria-label='23 chromosomes de l’ovule plus 23 du spermatozoïde donnent 46 dans la cellule-œuf'><g font-size='12' text-anchor='middle' fill='currentColor'><circle cx='50' cy='45' r='30' fill='#ec4899' fill-opacity='.3' stroke='currentColor'/><text x='50' y='42'>Ovule</text><text x='50' y='58'>23</text><circle cx='140' cy='45' r='30' fill='#3b82f6' fill-opacity='.3' stroke='currentColor'/><text x='140' y='42'>Spermato.</text><text x='140' y='58'>23</text><circle cx='250' cy='45' r='36' fill='#eab308' fill-opacity='.3' stroke='currentColor'/><text x='250' y='42'>Cellule-œuf</text><text x='250' y='58'>46</text><text x='95' y='51' font-size='22'>+</text><text x='195' y='51' font-size='22'>=</text></g></svg>"],
["Types de volcans",["Éruption effusive : lave fluide qui coule. Éruption explosive : lave visqueuse, gaz piégés, projections.","Volcan : relief formé par l’accumulation de matériaux issus d’un magma remonté en surface. Magma : roche fondue sous terre. Lave : magma arrivé en surface.","Cratère : ouverture au sommet ; cheminée : conduit par lequel le magma remonte ; chambre magmatique : réservoir sous le volcan.","Produits d’une éruption : coulées de lave, cendres, bombes volcaniques, gaz (vapeur d’eau, CO₂), nuées ardentes.","Risques : coulées, chutes de cendres, nuées ardentes. Surveillance : sismographes, mesures de gaz et de déformation du sol."],"<b>Explication :</b> la nature de la lave décide du type d’éruption : une lave fluide laisse échapper les gaz tranquillement (effusive), une lave visqueuse les bloque jusqu’à l’explosion.<br><br><b>Exemples :</b> le Piton de la Fournaise (La Réunion) a des éruptions effusives, avec des coulées de lave. Le Vésuve, en 79, a détruit Pompéi lors d’une éruption explosive avec cendres et nuées ardentes. Les volcans sont surveillés pour évacuer les habitants à temps.","<svg viewBox='0 0 300 152' role='img' aria-label='Coupe d’un volcan : chambre magmatique, cheminée, cratère'><path d='M20 130L120 40h60l100 90z' fill='#8d6e4a' fill-opacity='.5' stroke='currentColor'/><ellipse cx='150' cy='122' rx='45' ry='12' fill='#e0792a' fill-opacity='.75'/><path d='M150 112V42' stroke='#e0792a' stroke-width='8'/><path d='M130 38q20-30 40 0' stroke='#c93a45' stroke-width='3' fill='none'/><g font-size='11' fill='currentColor'><text x='190' y='30'>Cratère</text><text x='164' y='85'>Cheminée</text><text x='150' y='148' text-anchor='middle'>Chambre magmatique</text></g></svg>"] ,["Schéma : séisme",["Le foyer est en profondeur. L’épicentre est en surface, au-dessus du foyer."],"Les ondes se propagent depuis le foyer.",'<svg viewBox="0 0 320 180"><path d="M10 65 Q80 55 150 65 T310 65" fill="none" stroke="#15803d" stroke-width="4"/><path d="M160 145 L140 65" stroke="#64748b" stroke-dasharray="5 4"/><circle cx="160" cy="145" r="7" fill="#dc2626"/><circle cx="140" cy="65" r="6" fill="#f59e0b"/><path d="M160 145 Q190 125 220 145 M160 145 Q125 115 100 145" stroke="#dc2626" fill="none" stroke-width="2"/><text x="175" y="150" fill="currentColor">Foyer</text><text x="145" y="48" fill="currentColor">Épicentre</text></svg>']],
q:[["La couche rigide découpée en plaques s’appelle…",["la lithosphère","l’atmosphère","le noyau"],0,"Elle comprend la croûte et le haut du manteau."],
["Le point d’origine d’un séisme sous terre est…",["le foyer","l’épicentre","la faille"],0,"Le foyer est en profondeur."],
["Le point en surface au-dessus du foyer est…",["l’épicentre","le cratère","l’hypocentre"],0,"C’est là que les dégâts sont souvent les plus forts."],
["La fécondation est la rencontre…",["d’un spermatozoïde et d’un ovule","de deux ovules","de deux hormones"],0,"Elle forme la cellule-œuf."],
["La puberté est déclenchée par…",["des hormones","la taille","l’alimentation seule"],0,"Les hormones sexuelles provoquent les changements."],
["Un volcan à lave très fluide a une éruption…",["effusive","explosive","aucune"],0,"Les gaz s’échappent facilement."],
["Qu’est-ce qu’une espèce ?",["Des individus qui peuvent avoir des descendants fertiles ensemble","Tous les animaux d’un même milieu","Des individus de même taille"],0,"La définition repose sur la reproduction."],
["Que désigne la biodiversité ?",["La variété du vivant","Le nombre d’humains","La taille des forêts"],0,"Espèces, milieux et gènes."],
["Laquelle est une menace pour la biodiversité ?",["La destruction des habitats","Le manque de soleil","La rotation de la Terre"],0,"Déforestation et urbanisation réduisent les milieux de vie."],
["Quelle cellule transmet le message nerveux ?",["Le neurone","Le globule rouge","L’ovule"],0,"Les neurones forment les nerfs et le cerveau."],
["Où sont produits les spermatozoïdes ?",["Dans les testicules","Dans les ovaires","Dans l’utérus"],0,"Les ovaires, eux, produisent les ovules."],
["Une éruption explosive est liée à une lave…",["visqueuse","très fluide","froide"],0,"Les gaz restent piégés puis explosent."],
["Que se passe-t-il aux limites divergentes de plaques ?",["Les plaques s’écartent","Les plaques se rapprochent","Les plaques disparaissent"],0,"C’est le cas des dorsales océaniques."],
["Que mesure la magnitude d’un séisme ?",["L’énergie libérée","La profondeur du foyer","La durée de la secousse"],0,"L’intensité, elle, mesure les effets ressentis."],
["Comment s’appelle un nerf qui porte l’ordre vers un muscle ?",["Un nerf moteur","Un nerf sensitif","Un récepteur"],0,"Les nerfs sensitifs vont, eux, vers le centre nerveux."],
["Quel groupe réunit la baleine et l’être humain ?",["Les mammifères","Les poissons","Les reptiles"],0,"Ils ont des poumons, des poils et des mamelles."],
["Combien de chromosomes contient une cellule-œuf humaine ?",["46","23","92"],0,"23 de la mère + 23 du père."],
["Qu’est-ce que le magma ?",["De la roche fondue sous terre","De la lave refroidie","Un gaz volcanique"],0,"On l’appelle lave quand il arrive en surface."]]},
{id:"pc",n:"Physique-Chimie",c:"#be185d",x:[["Une résistance de 50 Ω est traversée par un courant de 0,2 A. Calcule la tension à ses bornes.","U = R × I = 50 × 0,2 = 10 V."],["On brûle 12 g de carbone avec 32 g de dioxygène. Quelle masse de dioxyde de carbone obtient-on ?","La masse se conserve : 12 + 32 = 44 g de dioxyde de carbone."],["Pendant un orage, tu entends le tonnerre 3 s après l’éclair. Le son parcourt 340 m/s. À quelle distance est la foudre ?","d = v × t = 340 × 3 = 1 020 m, soit environ 1 km. La lumière arrive presque instantanément."]],f:[
["Électricité",["Tension U en volts (V), intensité I en ampères (A), résistance R en ohms (Ω).","Loi d’Ohm : U = R × I.","En dérivation, la tension est la même aux bornes de chaque branche."],"Exemple : 100 Ω traversés par 0,05 A → U = 100 × 0,05 = 5 V. En série, l’intensité est la même partout ; en dérivation, c’est la tension.<br><br><b>Méthode avec U = R × I :</b> 1) Écris la formule. 2) Remplace par les valeurs avec les bonnes unités (V, Ω, A). 3) Calcule. Pour trouver R : R = U ÷ I. Pour trouver I : I = U ÷ R."],
["L’intensité du courant électrique",["Le courant électrique est un déplacement de charges électriques (des électrons dans un métal), possible seulement dans un circuit fermé.","L’intensité I mesure la quantité de charges qui traversent le fil chaque seconde. Unité : l’ampère (A) ; 1 A = 1 000 mA.","On la mesure avec un ampèremètre, branché en série dans le circuit.","En série : l’intensité est la même partout. En dérivation (loi des nœuds) : l’intensité du courant principal est la somme des intensités des branches."],"Pense à l’eau dans un tuyau : l’intensité, c’est le débit, la quantité qui passe en une seconde.<br><br><b>Pour la mesurer :</b> 1) Ouvre le circuit à l’endroit voulu. 2) Branche l’ampèremètre à cet endroit, en série. 3) Commence par le plus grand calibre, puis diminue-le.<br><br><b>Exemples :</b> 250 mA = 0,25 A. Si 0,5 A arrive à un nœud et que 0,2 A part dans une branche, l’autre branche reçoit 0,5 − 0,2 = 0,3 A."],
["Définitions : les grandeurs électriques",["Intensité I : débit de charges électriques, en ampères (A), mesurée avec un ampèremètre en série.","Tension U : différence d’énergie électrique entre deux points ; elle pousse le courant. Unité : le volt (V), mesurée avec un voltmètre branché en dérivation.","Résistance R : capacité d’un dipôle à s’opposer au passage du courant. Unité : l’ohm (Ω).","Loi d’Ohm : U = R × I pour un conducteur ohmique."],"Compare avec un circuit d’eau : la pompe est le générateur, la poussée de la pompe est la tension, le débit est l’intensité, et un tuyau très étroit joue le rôle de la résistance. Plus la résistance est grande, plus l’intensité est faible pour une même tension."],
["Définitions : le circuit électrique",["Circuit fermé : boucle sans coupure, avec un générateur ; le courant ne circule que dans un circuit fermé.","Générateur : fournit l’énergie (pile, batterie, prise). Récepteur : utilise cette énergie (lampe, moteur). Dipôle : composant à deux bornes.","Conducteur : laisse passer le courant (métaux, eau salée). Isolant : ne le laisse pas passer (plastique, verre, bois sec).","Court-circuit : un fil relie directement les bornes du générateur sans récepteur ; l’intensité devient très grande et dangereuse.","Série : un seul chemin pour le courant. Dérivation : plusieurs branches."],"Si une lampe grille dans un circuit en série, tout s’éteint car le chemin est coupé. En dérivation, les autres lampes continuent de briller : c’est le montage des prises de ta maison. Un court-circuit peut faire chauffer les fils, c’est pourquoi on installe des fusibles et des disjoncteurs."],
["Lumière",["Vitesse dans le vide : environ 300 000 km/s.","Source primaire : produit de la lumière (Soleil, lampe). Objet diffusant : renvoie la lumière reçue (Lune, livre).","Propagation : en ligne droite dans un milieu transparent et homogène. Un rayon lumineux se représente par une droite fléchée.","Réflexion : le rayon rebondit sur une surface (angle d’incidence = angle de réflexion). Réfraction : le rayon change de direction en passant d’un milieu à un autre (air → eau).","Ombre : zone non éclairée derrière un objet opaque. Lumière blanche : mélange de couleurs (arc-en-ciel). Année-lumière : distance parcourue par la lumière en un an."],"<b>Explication :</b> tu vois un objet parce que la lumière qu’il émet ou qu’il diffuse arrive dans ton œil. Une lampe est une source primaire ; la Lune ne produit pas de lumière, elle renvoie celle du Soleil.<br><br><b>Exemples :</b> l’ombre d’un arbre montre que la lumière va en ligne droite. Un crayon paraît cassé dans un verre d’eau : c’est la réfraction. Un miroir illustre la réflexion. La lumière du Soleil met environ 8 minutes à nous parvenir (150 millions de km ÷ 300 000 km/s = 500 s)."],
["Combustion",["Il faut un combustible et un comburant (le dioxygène).","Combustible : substance qui brûle (bois, gaz, essence). Comburant : ce qui permet la combustion (le dioxygène de l’air). Il faut aussi une température suffisante pour démarrer.","Triangle du feu : combustible + comburant + chaleur. Si on supprime l’un des trois, le feu s’éteint.","Combustion complète : produit du dioxyde de carbone (CO₂) et de l’eau. Combustion incomplète (manque de dioxygène) : peut produire du monoxyde de carbone (CO), gaz toxique et inodore.","Pour aller plus loin, le méthane : CH₄ + 2 O₂ → CO₂ + 2 H₂O."],"<b>Explication :</b> une combustion est une transformation chimique qui dégage de la chaleur et souvent de la lumière.<br><br><b>Exemples :</b> une bougie (cire = combustible, dioxygène = comburant, flamme = chaleur). On éteint un feu avec une couverture en coupant l’arrivée de dioxygène, ou avec de l’eau en abaissant la température. Dans une pièce mal aérée, un chauffage à gaz peut produire du CO : il faut ventiler."],
["Atomes, molécules et air",["La matière est faite d’atomes ; une molécule est un assemblage d’atomes.","L’air contient environ 78 % de diazote, 21 % de dioxygène et 1 % d’autres gaz.","Atome : plus petite particule d’un élément, représentée par un symbole : H (hydrogène), C (carbone), O (oxygène), N (azote). Molécule : atomes liés entre eux, avec une formule : H₂O, CO₂, O₂, N₂.","Corps pur : une seule espèce chimique (eau distillée). Mélange : plusieurs espèces (air, eau salée).","Tests : le dioxygène ravive une braise ; le dioxyde de carbone trouble l’eau de chaux."],"<b>Explication :</b> tout est fait d’atomes, comme une construction est faite de briques. Une molécule est une construction avec plusieurs briques.<br><br><b>Exemples :</b> H₂O contient 2 atomes d’hydrogène et 1 atome d’oxygène. CO₂ contient 1 carbone et 2 oxygènes. L’air est un mélange : il n’a pas de formule unique. Un modèle moléculaire (boules colorées) permet de représenter ces assemblages."],
["Transformations chimiques",["Les réactifs disparaissent, les produits apparaissent.","La masse totale se conserve : rien ne se perd, rien ne se crée.","Transformation chimique : des réactifs se transforment en produits, de nouvelles espèces chimiques apparaissent. Signes possibles : changement de couleur, gaz, chaleur, solide qui se forme.","Équation de réaction : réactifs → produits (carbone + dioxygène → dioxyde de carbone).","Conservation des atomes : les atomes se réarrangent sans disparaître ; il y a les mêmes atomes avant et après."],"Exemple : le bois qui brûle avec le dioxygène donne du CO₂ et de l’eau. Les atomes sont les mêmes avant et après, seulement réarrangés.<br><br><b>À retenir :</b> une transformation chimique crée de nouvelles espèces (rouille, combustion). Un changement d’état (eau → glace) n’en est pas une : les molécules restent les mêmes.<br><br><b>Exemples :</b> fer + dioxygène → rouille (une nouvelle substance apparaît). Vinaigre + bicarbonate → bulles de CO₂. Pour savoir si c’est chimique, cherche une nouvelle substance : l’eau qui bout est un changement d’état, le bois qui brûle est une transformation chimique."],
["États de la matière",["Solide, liquide, gaz. Changements d’état : fusion (solide → liquide), vaporisation (liquide → gaz), condensation (gaz → liquide), solidification (liquide → solide).","L’eau gèle à 0 °C et bout à 100 °C (pression normale).","Solide : forme et volume propres. Liquide : volume propre, prend la forme du récipient. Gaz : ni forme ni volume propres, se comprime facilement.","Sublimation : passage direct du solide au gaz (glace sèche). Pendant un changement d’état d’un corps pur, la température reste constante (palier)."],"<b>Idée simple :</b> quand on chauffe, les particules s’agitent davantage : glace → eau → vapeur. Quand on refroidit, c’est l’inverse. La substance reste la même ; seul l’état change.<br><br><b>Exemples :</b> un glaçon qui fond (fusion) ; la buée sur un miroir (condensation) ; le linge qui sèche (vaporisation) ; l’eau qui gèle (solidification) ; la glace sèche qui part en fumée (sublimation). Quand l’eau bout, sa température reste à 100 °C tant qu’il reste du liquide."],
["Mouvement",["On décrit un mouvement par sa trajectoire (rectiligne, circulaire…) et sa vitesse (constante, qui augmente ou diminue), par rapport à un référentiel.","Référentiel : l’objet par rapport auquel on décrit le mouvement (le sol, le train…). On est au repos dans un train par rapport au train, mais en mouvement par rapport au quai.","Trajectoire : la ligne décrite par l’objet (rectiligne, circulaire, courbe).","Vitesse moyenne : v = d ÷ t (m/s ou km/h). Conversion : 1 m/s = 3,6 km/h.","Mouvement uniforme : vitesse constante. Accéléré : la vitesse augmente. Ralenti : la vitesse diminue."],"<b>Explication :</b> un mouvement n’a de sens que par rapport à un référentiel.<br><br><b>Exemples :</b> dans un train, ton voisin est immobile par rapport à toi mais se déplace par rapport au quai. Une voiture qui parcourt 90 km en 1,5 h a une vitesse moyenne de 90 ÷ 1,5 = 60 km/h. Pour passer de m/s à km/h, on multiplie par 3,6 : 10 m/s = 36 km/h. Un point d’une roue de vélo a une trajectoire circulaire par rapport au cadre."],
["Formes d’énergie",["Énergies cinétique, thermique, électrique, chimique, lumineuse. L’énergie se convertit d’une forme à l’autre et se conserve. Unité : le joule (J).","Énergie cinétique : liée à la vitesse (un objet qui bouge) ; elle augmente avec la masse et la vitesse. Énergie potentielle : liée à la hauteur.","Énergie thermique : liée à la température. Électrique : transportée par le courant. Chimique : stockée dans les aliments, les piles, les combustibles. Lumineuse : portée par la lumière.","Source d’énergie : ce qui la fournit (pile, Soleil). Convertisseur : ce qui la transforme (moteur, lampe, panneau solaire). Renouvelable : Soleil, vent, eau. Non renouvelable : pétrole, gaz, charbon, uranium. Puissance : P = E ÷ t, en watts (W)."],"<b>Explication :</b> l’énergie ne se crée pas et ne disparaît pas : elle passe d’une forme à une autre, avec souvent de la chaleur non utile.<br><br><b>Exemples :</b> une lampe convertit l’énergie électrique en énergie lumineuse et thermique. Un panneau solaire convertit la lumière en électricité. Un cycliste convertit l’énergie chimique de son repas en énergie cinétique. Une lampe de 10 W consomme 10 J par seconde, soit 36 000 J en 1 heure."],
["Signaux lumineux et sonores",["La lumière se propage en ligne droite, même dans le vide (300 000 km/s).","Le son a besoin d’un milieu matériel : environ 340 m/s dans l’air, aucun son dans le vide.","Signal sonore : vibration qui se propage de proche en proche dans l’air, l’eau ou un solide. Il va plus vite dans l’eau (environ 1 500 m/s) et dans les solides que dans l’air.","Fréquence (en hertz, Hz) : nombre de vibrations par seconde ; elle donne un son grave (basse) ou aigu (haute). Amplitude : elle donne un son faible ou fort (en décibels, dB). L’humain entend environ de 20 Hz à 20 000 Hz.","Au-dessus de 20 000 Hz : ultrasons. En dessous de 20 Hz : infrasons.","Écho : son renvoyé par un obstacle. Distance : d = v × t."],"<b>Explication :</b> le son est une vibration qui a besoin de matière pour voyager ; la lumière, elle, traverse le vide.<br><br><b>Exemples :</b> dans un orage, on voit l’éclair avant d’entendre le tonnerre, car la lumière va beaucoup plus vite. Si le tonnerre arrive 3 s après, la foudre est à 340 × 3 = 1 020 m. Si tu cries face à une falaise et que l’écho revient après 2 s, le son a fait l’aller-retour : la falaise est à 340 × 2 ÷ 2 = 340 m. Une corde de guitare plus courte donne un son plus aigu."] ,["Schéma : circuit électrique",["Une pile, des fils et une lampe forment un circuit fermé."],"Le courant circule dans la boucle fermée.",'<svg viewBox="0 0 320 180"><path d="M65 50 H240 V130 H65 Z" fill="none" stroke="#be185d" stroke-width="3"/><path d="M65 80 H95 M95 65 V95 M110 60 V100 M110 80 H155" stroke="#be185d" stroke-width="3"/><circle cx="185" cy="80" r="24" fill="#fce7f3" stroke="#be185d" stroke-width="3"/><path d="M170 65 L200 95 M200 65 L170 95" stroke="#be185d" stroke-width="2"/><text x="55" y="45" fill="currentColor">Pile</text><text x="170" y="120" fill="currentColor">Lampe</text><text x="105" y="155" fill="currentColor">Circuit fermé</text></svg>']],

["Quelle est la loi d’Ohm ?",["U = R × I","U = R ÷ I","I = U × R"],0,"U en V, R en Ω, I en A."],

["Comment appelle-t-on les espèces qui disparaissent lors d’une transformation chimique ?",["Les réactifs","Les produits","Les catalyseurs"],0,"Les réactifs se transforment en produits."],
["Comment s’appelle le passage de l’état liquide à l’état gazeux ?",["La vaporisation","La fusion","La condensation"],0,"La fusion va du solide au liquide ; la condensation du gaz au liquide."],
["À quelle température l’eau bout-elle (pression normale) ?",["100 °C","0 °C","50 °C"],0,"À 0 °C, c’est la solidification."],
["Que se passe-t-il pour le son dans le vide ?",["Il ne se propage pas","Il se propage à 340 m/s","Il va à la vitesse de la lumière"],0,"Le son a besoin d’un milieu matériel."],

["Comment appelle-t-on une trajectoire en ligne droite ?",["Rectiligne","Circulaire","Courbe"],0,"Elle s’oppose à une trajectoire circulaire."],
["Avec quel appareil mesure-t-on l’intensité du courant ?",["Un ampèremètre","Un voltmètre","Un thermomètre"],0,"L’ampèremètre mesure l’intensité, en ampères."],
["Comment branche-t-on un ampèremètre ?",["En série","En dérivation","Aux bornes du générateur uniquement"],0,"Le courant doit le traverser pour être mesuré."],
["Convertis 250 mA en ampères.",["0,25 A","2,5 A","25 A"],0,"1 mA = 0,001 A, donc 250 mA = 0,25 A."],

["Qu’est-ce qu’un court-circuit ?",["Un fil qui relie les bornes du générateur sans récepteur","Un circuit trop long","Une lampe qui brille fort"],0,"L’intensité devient très grande, d’où le danger."],
["Quelle grandeur se mesure en ohms (Ω) ?",["La résistance","L’intensité","La tension"],0,"L’intensité est en ampères et la tension en volts."],
