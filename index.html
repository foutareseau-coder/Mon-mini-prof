["Comment appelle-t-on le passage direct de l’état solide à l’état gazeux ?",["La sublimation","La fusion","La condensation"],0,"Exemple : la glace sèche."],
["Un train roule à 72 km/h. Quelle est sa vitesse en m/s ?",["20 m/s","259 m/s","7,2 m/s"],0,"On divise par 3,6 : 72 ÷ 3,6 = 20."],
["Quelle est la formule du dioxyde de carbone ?",["CO₂","CO","C₂O"],0,"Un atome de carbone et deux atomes d’oxygène."],

["Quel phénomène explique qu’un crayon paraît cassé dans un verre d’eau ?",["La réfraction","La réflexion","L’écho"],0,"La lumière change de direction en passant de l’eau à l’air."]]},
{id:"tech",n:"Technologie",c:"#b45309",x:[["Décris en langage courant l’algorithme d’un portail automatique avec un capteur de voiture.","Si le capteur détecte une voiture, alors le moteur ouvre le portail, sinon le portail reste fermé. Il y a un capteur, une condition et un actionneur."],["Donne 3 règles pour un mot de passe sûr.","Long (12 caractères ou plus), mélange de majuscules, minuscules, chiffres et symboles ; différent pour chaque compte ; sans informations personnelles."],["Cite les étapes de vie d’un smartphone et 2 gestes pour réduire son impact.","Conception, fabrication, utilisation, fin de vie. Gestes : le réparer et le garder plus longtemps, le faire recycler ou reconditionner."]],f:[
["Objets techniques",["Un objet répond à un besoin. Le cahier des charges liste ses fonctions et ses contraintes.","Chaîne d’information : acquérir (capteur), traiter (carte programmable), communiquer. Chaîne d’énergie : alimenter, distribuer, convertir (actionneur, moteur), transmettre."]],
["Programmation",["Un programme utilise des variables, des boucles (répéter) et des conditions (si… alors… sinon).","Un capteur envoie une information ; l’actionneur réalise une action."],"<b>Exemple :</b> un volet roulant. Si la lumière mesurée par le capteur est faible, alors le moteur descend le volet. Le programme répète la mesure en boucle, sans s’arrêter."],
["Données et impact",["Protège tes données : mot de passe long, mêlant lettres, chiffres et symboles, différent pour chaque compte.","Pour limiter l’impact d’un objet : le réparer, le réutiliser, le recycler."]] ,["Schéma : chaîne d’information et d’énergie",["Information : capteur → traitement → action. Énergie : alimentation → moteur."],"Le capteur mesure, le programme traite, l’actionneur réalise l’action.",'<svg viewBox="0 0 320 180"><rect x="8" y="20" width="90" height="42" rx="8" fill="#fef3c7" stroke="#b45309"/><rect x="115" y="20" width="90" height="42" rx="8" fill="#fef3c7" stroke="#b45309"/><rect x="222" y="20" width="90" height="42" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="53" y="45" text-anchor="middle" fill="#713f12">Capteur</text><text x="160" y="45" text-anchor="middle" fill="#713f12">Traitement</text><text x="267" y="45" text-anchor="middle" fill="#713f12">Action</text><path d="M98 41 H115 M205 41 H222" stroke="#b45309" stroke-width="3"/><rect x="8" y="105" width="90" height="42" rx="8" fill="#ffedd5" stroke="#b45309"/><rect x="115" y="105" width="90" height="42" rx="8" fill="#ffedd5" stroke="#b45309"/><rect x="222" y="105" width="90" height="42" rx="8" fill="#ffedd5" stroke="#b45309"/><text x="53" y="130" text-anchor="middle" fill="#713f12">Alimenter</text><text x="160" y="130" text-anchor="middle" fill="#713f12">Distribuer</text><text x="267" y="130" text-anchor="middle" fill="#713f12">Moteur</text><path d="M98 126 H115 M205 126 H222" stroke="#b45309" stroke-width="3"/></svg>']],

{id:"es",n:"Espagnol (LV2)",c:"#b91c1c",x:[["Complète avec ser ou estar : Yo ___ francés. Mi casa ___ en Orléans.","Yo soy francés (origine → ser). Mi casa está en Orléans (lieu → estar)."],["Conjugue au présent : (hablar, nosotros) ; (comer, ellos) ; (vivir, tú).","hablamos ; comen ; vives."],["Traduis : « J’aime les chats. » et « Je vais manger. »","Me gustan los gatos (pluriel → gustan). Voy a comer (ir a + infinitif)."]],f:[
["Ser, estar et tener",["Ser : soy, eres, es, somos, sois, son (identité, origine, profession).","Estar : estoy, estás, está, estamos, estáis, están (lieu, état du moment).","Tener : tengo, tienes, tiene, tenemos, tenéis, tienen (avoir ; l’âge : tengo 13 años)."],"Ser dit ce qu’on est de façon durable : Soy francés. Estar dit où on est ou comment on va maintenant : Estoy en casa. Estoy cansado. Pour l’âge, on « a des années » : Tengo 13 años."],
["Le présent des verbes r\u00e9guliers",["-ar : hablo, hablas, habla, hablamos, habláis, hablan.","-er : como, comes, come, comemos, coméis, comen.","-ir : vivo, vives, vive, vivimos, vivís, viven."],"On enlève -ar, -er ou -ir, puis on ajoute la terminaison de la personne. Le pronom sujet (yo, tú…) est souvent omis, car la terminaison suffit : Hablo español."],
["Verbes irréguliers et futur proche",["Ir : voy, vas, va, vamos, vais, van.","Diphtongue : e → ie (querer : quiero), o → ue (poder : puedo).","Futur proche : ir a + infinitif (voy a comer)."],"Certains verbes changent leur voyelle sauf pour nosotros et vosotros : quiero, quieres, queremos. Pour parler de ce qu’on va faire, on conjugue ir puis on ajoute a + l’infinitif : Vamos a viajar."],
["Articles, genre et pluriel",["el / la (le, la) ; un / una (un, une) ; los / las (les).","Pluriel : on ajoute -s après une voyelle, -es après une consonne.","L’adjectif s’accorde et se place souvent après le nom."],"La casa grande → las casas grandes : tous les mots s’accordent. Le nom est masculin en -o (el libro) et souvent féminin en -a (la mesa)."],

["Vocabulaire de base",["Nombres : uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez.","Jours : lunes, martes, miércoles, jueves, viernes, sábado, domingo.","Famille : madre, padre, hermano, hermana, abuelo, abuela."],"Les jours de la semaine ne prennent pas de majuscule en espagnol. Pour saluer : Hola (salut), Buenos días (bonjour le matin), Buenas noches (bonsoir, bonne nuit), Adiós (au revoir)."]],

var Q,qi,sc,si;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function quiz(i){si=i;qi=0;sc=0;var s=S[i],id=s.id,all=s.q.map(function(_,k){return k}),sn=seen[id]||[],pk=shuf(all.filter(function(k){return sn.indexOf(k)<0})).slice(0,QN);
 if(pk.length<QN){var rest=shuf(all.filter(function(k){return pk.indexOf(k)<0})).slice(0,QN-pk.length);sn=pk.slice();pk=pk.concat(rest)}else{sn=sn.concat(pk)}
 seen[id]=sn;save();Q=shuf(pk).map(function(k){return s.q[k]});ask()}
var TM;
function stopT(){clearInterval(TM)}
function startT(q){var t=20;stopT();var el=document.getElementById("tm"),bar=document.getElementById("tb");TM=setInterval(function(){t--;el.textContent=t+" s";bar.style.width=(t*5)+"%";if(t<=0){stopT();pick(null,q)}},1000)}
function ask(){
 var s=S[si],q=Q[qi];
 var opts=shuf(q[1].map(function(o,k){return{o:o,r:k===q[2]}}));
 var h='<div '+sty(s)+'><button class="back" onclick="subj('+si+',0)">‹ '+s.n+'</button><div class="prog"><i style="width:'+(qi/Q.length*100)+'%"></i></div><p class="sub">Question '+(qi+1)+' sur '+Q.length+'<b id="tm" style="float:right">20 s</b></p><div class="prog" style="margin-top:0"><i id="tb" style="width:100%;background:var(--ko)"></i></div><p class="q">'+q[0]+'</p><div id="o">';
 opts.forEach(function(x,k){h+='<button class="opt" data-r="'+(x.r?1:0)+'">'+x.o+'</button>'});
 h+='</div><div id="fb"></div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(b,q)}});startT(q)}
function pick(b,q){
 stopT();var all=document.querySelectorAll(".opt"),good=b?b.dataset.r==="1":false;
 if(good)sc++;
 Array.prototype.forEach.call(all,function(x){x.disabled=true;if(x.dataset.r==="1")x.classList.add("ok")});
 if(!good&&b)b.classList.add("ko");
 var last=qi===Q.length-1;
 document.getElementById("fb").innerHTML='<div class="exp"><b>'+(good?'Bravo !':b?'Pas tout à fait.':'Temps écoulé !')+'</b> '+q[3]+'</div><button class="go" id="nx">'+(last?'Voir mon score':'Question suivante')+'</button>';
 document.getElementById("nx").focus();
 document.getElementById("nx").onclick=function(){if(last)end();else{qi++;ask()}}}
function end(){
 var s=S[si],n=Q.length;
 if(best[s.id]==null||sc>best[s.id]){best[s.id]=sc;save()}
 var m=sc===n?'Parfait, tu maîtrises !':sc>=n*0.7?'Très bien, encore un effort pour le sans-faute.':sc>=n/2?'Bon début : relis la fiche puis recommence.':'Relis la fiche tranquillement, puis retente.';
 app.innerHTML='<div '+sty(s)+' class="center"><h2>'+s.n+'</h2><div class="big">'+sc+'/'+n+'</div><p>'+m+'</p><button class="go" onclick="subj('+si+',3)">➡️ Entraînement</button><button class="tab" style="width:100%;margin-top:10px" onclick="quiz('+si+')">Recommencer</button><button class="tab" style="width:100%;margin-top:10px" onclick="subj('+si+',1)">Relire la fiche</button><button class="back" onclick="home()">Retour aux matières</button></div>';
 window.scrollTo(0,0)}
home();
</script>
</body>
</html>
